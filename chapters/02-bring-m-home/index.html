<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Bring M Home</title>
  <script>
    // The browser's back/forward cache can restore this exact page instance
    // — DOM, running timers, everything — with no script re-run, instead of
    // a real reload. Pressing browser Back into this page after playing
    // through once was landing on a stale instance: DEV_JUMP_TO_ENDING's
    // one-time key/tap listener had already fired and self-removed on the
    // first visit, so a fresh key press did nothing, while the camera
    // beat's own opacity animations (the snap button fading out, the →
    // continue button fading in) had long since finished — so a tap in
    // that spot landed on the already-visible continue button instead of a
    // working snap button, skipping straight past the second photo. Forcing
    // a real reload on any bfcache restore (event.persisted) guarantees
    // every visit is the fresh run this page's timers assume.
    window.addEventListener("pageshow", function (event) {
      if (event.persisted) window.location.reload();
    });
  </script>
  <!-- The only stylesheet shared with the hub: the type, so Thai in here is the
       same face as Thai out there. -->
  <link rel="stylesheet" href="../../shared/fonts.css" />
  <style>
    @font-face {
      font-family: "Ghastly Panic";
      src: url("../../shared/fonts/Ghastly%20Panic.ttf") format("truetype");
      font-display: swap;
    }
    @font-face {
      font-family: "KC Nightmare";
      src: url("../../shared/fonts/KC%20Nightmare.ttf") format("truetype");
      font-display: swap;
    }
    /*
     * Every `font:` shorthand below resets font-family, which is how Thai ends up
     * in the system face even with fonts.css loaded — the shorthand silently
     * throws iannnnn-DOG away. --th is that stack, applied to each of them.
     *
     * Putting it first is safe for Latin: fonts.css scopes iannnnn-DOG to
     * U+0E00-0E7F, so anything not Thai falls straight through to ui-sans-serif.
     */
    :root {
      --th: "iannnnn-DOG", ui-sans-serif, system-ui, -apple-system, sans-serif;
      /* The letter's own stack. Georgia and ui-serif carry no Thai at all, so
         without iannnnn-DOG ahead of them a Thai letter renders in the system
         face — and a handwritten face is the right one for a love letter anyway. */
      --th-serif: "iannnnn-DOG", ui-serif, Georgia, "Noto Serif Thai", serif;
    }
    html, body { margin: 0; height: 100%; background: #04040a; overflow: hidden;
      font-family: var(--th); color: #fff;
      -webkit-user-select: none; user-select: none; }
    #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    canvas { display: block; background: #04040a; touch-action: none; cursor: default; }

    .chapter-back { position: fixed; top: 12px; left: 12px; z-index: 60; padding: 7px 13px;
      border-radius: 999px; background: rgba(0,0,0,.5); color: #fff; text-decoration: none;
      font: 500 11px/1 var(--th); letter-spacing: .1em; text-transform: uppercase;
      border: 1px solid rgba(255,255,255,.25); }

    .memory-bag-btn { position: fixed; right: 12px; top: 58px; z-index: 54; min-width: 92px;
      padding: 9px 13px; border: 1px solid rgba(231,185,92,.55); border-radius: 999px;
      background: rgba(17,10,23,.82); color: #ffe1a0; cursor: pointer;
      font: 700 15px/1 var(--th); box-shadow: 0 0 18px rgba(202,139,58,.2); }
    .memory-bag-btn[hidden] { display: none; }

    /* ------------------------------------------------------- story overlays */

    .overlay { position: fixed; inset: 0; z-index: 55; display: flex; align-items: center;
      justify-content: center; background: rgba(4,4,10,.84); backdrop-filter: blur(3px);
      padding: 24px; text-align: center; }
    .overlay[hidden] { display: none; }
    /* `solid` is for the beats that are the whole screen rather than a pause on
       top of the game — the title card, the door, the controls. */
    .overlay.solid { background: #04040a; backdrop-filter: none; }
    .overlay.warm { background: linear-gradient(180deg, #fff6f8 0%, #ffe6ec 100%); color: #2a2530; }
    .overlay-inner { max-width: 620px; }

    /* The camera scene's ejected card hangs well below the camera itself —
       centring vertically (the default) leaves too much empty space above
       and can run the card off the bottom of short viewports. Pin near the
       top instead, with scroll as a fallback on anything still too short. */
    .overlay.cam-beat { align-items: flex-start; overflow-y: auto; padding-top: 6vh; }

    .line { font: 700 clamp(19px, 4vw, 30px)/1.35 var(--th); margin: 0 0 14px; }
    .line.big { font-weight: 800; font-size: clamp(24px, 5.4vw, 44px); letter-spacing: .01em; }
    .line.zone { font-weight: 800; letter-spacing: .22em; font-size: clamp(18px, 3.6vw, 28px); }
    .line.small { font-size: clamp(14px, 2.8vw, 19px); font-weight: 500; opacity: .78; }
    .line.quiet { opacity: .9; line-height: 1.7; }

    .tap { margin-top: 24px; padding: 12px 28px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,.4); background: transparent; color: inherit;
      font: 700 13px/1 var(--th); letter-spacing: .16em; text-transform: uppercase; cursor: pointer; }
    .overlay.warm .tap { border-color: rgba(0,0,0,.3); }
    .tap:hover { background: rgba(255,255,255,.14); }
    .overlay.warm .tap:hover { background: rgba(0,0,0,.06); }

    .overlay.memory-overlay { padding: 14px 24px; overflow-y: auto;
      background: radial-gradient(circle at 50% 42%, rgba(92,50,125,.46), rgba(3,3,10,.94) 68%); }
    .overlay.memory-overlay .overlay-inner { display: flex; width: 100%; max-width: 760px;
      min-height: min(100%, 760px); align-items: center; justify-content: center; }
    .memory-reveal { display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: min(90vw, 620px); max-height: calc(100vh - 28px); text-align: center; }
    .memory-reveal img { display: block; width: auto; max-width: min(78vw, 470px);
      height: auto; max-height: min(52vh, 500px); object-fit: contain;
      margin: 8px auto 12px; border: 3px solid #d6a654; border-radius: 14px;
      box-shadow: 0 0 0 6px rgba(39,23,49,.92), 0 0 38px rgba(222,163,76,.46); }
    .memory-reveal p { margin: 0 auto 8px; max-width: 560px; color: #ffe6af;
      font: 400 clamp(20px, 3.1vw, 30px)/1.3 "iannnnn-DOG", sans-serif;
      text-shadow: 0 2px 18px rgba(255,188,97,.38); }
    .memory-kicker { color: #c9a6ef; font-family: "iannnnn-DOG", sans-serif; font-size: 18px; letter-spacing: .08em; }
    .memory-reveal .tap { flex: 0 0 auto; margin-top: 8px; }
    .memory-inventory { width: min(90vw, 760px); }
    .memory-inventory h2 { margin: 0 0 18px; color: #ffe0a0; font: 700 30px/1.2 var(--th); }
    .memory-slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .memory-slot { min-height: 270px; padding: 12px; border: 2px solid rgba(213,166,84,.45);
      border-radius: 15px; background: rgba(19,13,25,.9); color: #ffe8b7; }
    .memory-slot img { width: 100%; height: 145px; object-fit: cover; border-radius: 9px; }
    .memory-slot h3 { margin: 10px 0 6px; font: 700 20px/1.2 var(--th); }
    .memory-slot p { margin: 0; font: 400 17px/1.35 var(--th); }
    .memory-slot.locked { display: grid; place-items: center; color: rgba(255,255,255,.32);
      font: 700 42px/1 var(--th); border-style: dashed; }
    @media (max-width: 650px) {
      .memory-reveal img { max-height: 46vh; max-width: 76vw; }
      .memory-reveal p { font-size: 20px; line-height: 1.25; }
      .memory-slots { grid-template-columns: 1fr; max-height: 62vh; overflow-y: auto; }
      .memory-slot { min-height: 210px; }
    }
    .tap.yes { font-size: 18px; padding: 15px 46px; border-color: rgba(255,255,255,.75); }

    .controls { display: flex; flex-direction: column; gap: 11px; margin: 20px 0 4px; }
    .ctrl { display: flex; align-items: center; gap: 14px; text-align: left;
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14);
      border-radius: 14px; padding: 12px 14px; }
    .ctrl .key { flex: 0 0 auto; min-width: 92px; text-align: center; padding: 8px 10px;
      border-radius: 10px; background: rgba(255,255,255,.14);
      font: 800 12px/1.3 var(--th); letter-spacing: .06em; }
    .ctrl .key span { display: block; font-weight: 500; font-size: 10px; opacity: .7; }
    .ctrl .what { font: 500 13px/1.45 var(--th); opacity: .8; }
    .ctrl .what b { display: block; font-size: 15px; margin-bottom: 2px; opacity: 1; }

    /* M's voice during the heal. Never blocks input — she is holding the button
       while these appear, and an overlay would eat the hold. */
    #say { position: fixed; left: 0; right: 0; bottom: 17%; z-index: 65; text-align: center;
      pointer-events: none; font: 500 italic clamp(19px, 3.6vw, 30px)/1.4 var(--th);
      color: #ffe6ea; opacity: 0; text-shadow: 0 2px 24px rgba(0,0,0,.9); padding: 0 20px; }
    #say.in { animation: sayIn 900ms ease both; }
    @keyframes sayIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

    /* ---------------------------------------------------------- ending snap */

    /* The exact gameplay frame at the moment the heart is placed, captured
       from the canvas: freezes, shrinks and rotates slightly, then fades
       away entirely. Nothing else shows — no card, no flash — the shutter
       sound (see goHome) is the cut straight into RESCUE COMPLETE. */
    /* Opaque white, not transparent — as the frame shrinks, this is what
       should show around it, not the live game canvas still underneath. */
    .cam-snap { position: fixed; inset: 0; z-index: 68; background: #fff;
      pointer-events: none; }
    .cam-snap[hidden] { display: none; }

    .cam-snap-raw { position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; transform-origin: 50% 50%;
      animation: camSnapShrink .95s cubic-bezier(.4,0,.2,1) .2s both; }
    @keyframes camSnapShrink {
      0%   { transform: scale(1) rotate(0deg); opacity: 1; }
      74%  { transform: scale(.34) rotate(0deg); opacity: 1; }
      92%  { transform: scale(.34) rotate(-2deg); opacity: 1; }
      100% { transform: scale(.34) rotate(-2deg); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cam-snap-raw { animation: none; opacity: 0; }
    }

    /* ------------------------------------------------------------- cutscene */

    #cine { position: fixed; inset: 0; z-index: 80; overflow: hidden; background: #000; }
    #cine[hidden] { display: none; }

    .cine-layer { position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; opacity: 0; will-change: opacity, transform, filter; }

    /* The pressure messages arrive as real text, so every phrase stays sharp and
       readable at any screen size instead of being baked into a photograph. */
    .cine-card { position: absolute; z-index: 3; box-sizing: border-box;
      display: grid; place-items: center; padding: 8px 14px;
      border: 2px solid rgba(234,91,111,.72); border-radius: 8px;
      background: rgba(24,8,17,.82); color: #ec8693;
      box-shadow: 0 0 20px rgba(222,55,82,.34), 0 8px 28px rgba(0,0,0,.74); opacity: 0; pointer-events: none;
      font: 400 clamp(18px, 2.2vw, 34px)/1.05 "KC Nightmare", var(--th);
      letter-spacing: .025em; text-align: center;
      text-shadow: 0 3px 2px #000, 0 0 18px rgba(173,38,61,.72);
      will-change: opacity, filter, transform; }

    /* The shadow that sweeps the frame change underneath it. */
    .cine-wipe { position: absolute; top: -5%; bottom: -5%; left: 0; width: 190%; z-index: 5;
      pointer-events: none; transform: translateX(100%);
      background: linear-gradient(90deg, rgba(5,5,10,0) 0%, #05050a 20%,
                  #05050a 80%, rgba(5,5,10,0) 100%); }

    .cine-veil { position: absolute; inset: 0; z-index: 6; background: #000;
      opacity: 0; pointer-events: none; }
    .cine-flash { position: absolute; inset: 0; z-index: 7; background: #fff;
      opacity: 0; pointer-events: none; }

    .cine-skip { position: absolute; bottom: 18px; right: 20px; z-index: 8; margin: 0;
      font: 600 10px/1 var(--th); letter-spacing: .22em; text-transform: uppercase;
      color: rgba(255,255,255,.35); pointer-events: none; }

    #cine.shake { animation: cine-shake 420ms ease-out; }
    @keyframes cine-shake {
      0%, 100% { transform: none; }
      12% { transform: translate(-9px, 5px) rotate(-.5deg); }
      28% { transform: translate(8px, -6px) rotate(.4deg); }
      46% { transform: translate(-6px, -3px); }
      66% { transform: translate(4px, 4px); }
      84% { transform: translate(-2px, -1px); }
    }

    @media (prefers-reduced-motion: reduce) {
      #cine.shake { animation: none; }
      .cine-layer { transition-duration: 220ms !important; }
    }

    /* --------------------------------------------------------------- letter */

    .letter { position: fixed; inset: 0; z-index: 90; overflow-y: auto;
      background: linear-gradient(180deg, #fff6f8 0%, #ffeaf0 100%); color: #2a2530;
      padding: 40px 22px 80px; }
    .letter[hidden] { display: none; }
    .letter-inner { max-width: 620px; margin: 0 auto; text-align: center; }
    .letter img.couple { width: 100%; max-width: 420px; border-radius: 20px;
      box-shadow: 0 18px 50px rgba(0,0,0,.22); }
    .letter h1 { font: 700 clamp(28px, 6vw, 44px)/1.2 var(--th-serif); margin: 26px 0 6px; }
    .letter .body { text-align: left; font: 400 16px/1.85 var(--th-serif);
      white-space: pre-line; margin: 22px 0 0; }
    .letter .placeholder { background: #fff3c4; border: 1px dashed #c9a227; border-radius: 12px;
      padding: 14px 16px; font-family: ui-monospace, monospace; font-size: 13px; text-align: left;
      white-space: pre-line; margin-top: 18px; }
    .letter .home { display: inline-block; margin-top: 34px; padding: 12px 24px; border-radius: 999px;
      background: #2a2530; color: #fff; text-decoration: none;
      font: 700 12px/1 var(--th); letter-spacing: .14em; text-transform: uppercase; }

    /* -------------------------------------------------------- polaroid eject */

    /* The camera is the real, uncropped reference photo (assets/ui/instax-camera.png)
       and never moves. The card is not hidden behind it and slid into frame —
       cam-slot-mask clips the card exactly at the drawn slot's own position
       (measured directly against the file), so it genuinely looks like it's
       printing out — more of it is revealed as it moves — rather than
       something pre-sized emerging from behind the camera body. */
    /* Explicit width, matched exactly to .cam below, rather than left to
       shrink-wrap — cam-slot-mask is sized as a percentage of THIS box, so
       any mismatch between the two throws the card off-centre by however
       much they'd drifted apart. */
    /* margin-bottom (a percentage of THIS box's own width, same trick as
       cam-slot-mask's height below) reserves real flow space for the cards
       hanging out and settling below the camera — cam-slot-mask itself is
       absolutely positioned so it never pushes .cam-cta down on its own;
       without this the snap button rendered up over the photos instead of
       under them. Has to be margin, not padding: cam-slot-mask's own top/
       height percentages below are resolved against .cam-scene's height,
       and padding here would inflate that height and drag the slot
       position (and the whole photo) down the page with it. Margin sits
       outside the box, so it reserves the flow space without touching
       that height at all. */
    /* A separate layer rather than just swapping .overlay's own background:
       .overlay's background is a plain linear-gradient (.warm) elsewhere,
       and CSS can't reliably transition FROM that TO a radial gradient —
       different gradient functions don't interpolate, so the change would
       just snap instead of dimming. Fading this layer's opacity in on top
       does the same "lights go down" job with a property (opacity) that
       always animates cleanly. Sits behind .cam-scene/.cam-cta (z-index 2
       below) so the camera, the cards and the buttons stay lit above it —
       that's the point of it, not an accident of paint order.
       Only switched on by #camBeatInner.dim, added by game/scenes.js 7.4s
       into the .p2 click — the exact moment camDrift2 itself starts — so
       the room goes dark WHILE the birthday card is sliding down, not
       before it's even out or only once it's already landed. 1.9s duration
       matches camDrift2's own, so the settle and the dim finish together. */
    .cam-dim { position: fixed; inset: 0; z-index: 1; pointer-events: none;
      opacity: 0;
      background: radial-gradient(ellipse 65% 50% at 50% 30%,
        rgba(255, 224, 188, .16), rgba(6, 4, 10, .95) 62%); }
    .cam-beat-inner.dim .cam-dim { animation: camDimIn 1.9s ease both; }
    @keyframes camDimIn { from { opacity: 0; } to { opacity: 1; } }

    /* Falling snow — only once the room's actually dark (.dim), same gate
       as .cam-dim itself, so there's no snow visibly falling against the
       still-pink pre-dim background. Fixed, full-viewport, behind every
       card (z-index 1, same layer as .cam-dim) so it reads as ambient
       backdrop rather than something landing on the photos. The flakes
       themselves (.snowflake) are a fixed, hand-picked set built once in
       buildSnowHTML() in game/scenes.js, not re-randomised per play —
       negative animation-delay values are what let some already be
       mid-fall the instant this turns on, instead of every flake starting
       at the top together and reading as a synchronised sheet. */
    .cam-snow { position: fixed; inset: 0; z-index: 1; pointer-events: none;
      opacity: 0; overflow: hidden; }
    .cam-beat-inner.dim .cam-snow { animation: camSnowIn 1.9s ease both; }
    @keyframes camSnowIn { from { opacity: 0; } to { opacity: .85; } }
    .snowflake { position: absolute; top: -8vh; border-radius: 50%;
      background: radial-gradient(circle, #fff 0%, rgba(255,255,255,.4) 70%, rgba(255,255,255,0) 100%);
      animation-name: camSnowFall; animation-timing-function: linear; animation-iteration-count: infinite; }
    @keyframes camSnowFall {
      0%   { transform: translate(0, 0) translateX(0); opacity: 0; }
      8%   { opacity: 1; }
      50%  { transform: translate(1.2vw, 60vh) translateX(0); }
      92%  { opacity: 1; }
      100% { transform: translate(-1vw, 118vh) translateX(0); opacity: 0; }
    }

    /* The birthday message — on the SAME two flanking spots as .cam-cue
       (left/right of the camera, reusing --cue-gap so it's positioned by
       the identical, already-mobile-safe formula), not centred below the
       stack any more: that read as sitting through/behind the falling
       cards instead of beside them. top:15% starts it near the top of the
       camera and each paragraph just adds height growing downward — it
       stays inside the same side margin the cards never enter, so nothing
       can overlap regardless of how tall the printed stack gets. White
       text against the dark .cam-dim backdrop (this only ever shows once
       that's up). Each .note-line is built once (buildNoteHTML() in
       game/scenes.js) already opacity:0/translateY — showBirthdayNote()
       adds .show to one at a time, staggered, so the message reads as
       rising into place paragraph by paragraph rather than landing as one
       block. white-space:pre-line renders the \n inside each paragraph's
       own 3 lines as-is, no <br> needed. */
    .cam-note { position: absolute; z-index: 9; top: 15%; pointer-events: none;
      max-width: min(340px, calc(var(--cue-gap) - 12px));
      font: 600 clamp(17px, 2.3vw, 22px)/1.5 var(--th); color: #fff; }
    .cam-note.left { left: max(-33vw, calc(-1 * var(--cue-gap))); text-align: center; }
    .cam-note.right { right: max(-33vw, calc(-1 * var(--cue-gap))); text-align: center; }
    /* overflow-wrap/word-break here are the actual fix for lines running
       past the column's edge — Thai has no spaces to hint safe break
       points the way Latin text does, so without this a long line just
       overflows instead of wrapping. Once this is in place the \n's in
       BIRTHDAY_NOTE/ANNIVERSARY_NOTE (game/scenes.js) only need to mark
       real paragraph-internal pauses, not every few words — over-
       splitting there was trading the horizontal overflow for a vertical
       one, each paragraph growing so tall the whole note ran down past
       the photos instead. */
    .cam-note .note-line { margin: 0 0 1.15em; opacity: 0; transform: translateY(34px);
      transition: opacity 1.4s ease, transform 1.4s ease; white-space: pre-line;
      overflow-wrap: break-word; word-break: break-word;
      text-shadow: 0 2px 10px rgba(0, 0, 0, .75), 0 0 22px rgba(0, 0, 0, .45); }
    .cam-note .note-line:last-child { margin-bottom: 0; }
    .cam-note .note-line.show { opacity: 1; transform: translateY(0); }

    /* "ยิ้มมมม" then 3 2 1, on BOTH sides of the camera at once — absolute
       within .cam-scene (not fixed to the viewport) so top:90% always
       lines up with roughly where the camera-and-photo pair sits together
       (below the camera's own midpoint, since the photo hangs further
       down) rather than the viewport's own centre, which is well below
       everything given .cam-beat pins content near the top of the page —
       that mismatch is what had it reading as "not centred" before.
       left/right use vw so the two sides land a consistent distance out
       in the actual side margins regardless of .cam-scene's own capped
       400px width. Text content and the show/colour classes are all
       driven by runCountdown() in game/scenes.js; this is just the fade —
       a plain opacity transition, since each step is a one-off show-then-
       hide rather than a looping or precisely-timed keyframe sequence.
       Mint (#B5E3D8, the exact swatch given) for "ยิ้มมมม"; c3/c2/c1 give
       the numbers their own solid colours instead — yellow, orange, red —
       so the countdown reads as escalating urgency and lands on red right
       as "1" hits, just before the shutter. Both the shadow's dark half
       and its warm half are there for contrast against BOTH the light
       pink background early on and the dark .cam-dim backdrop later — one
       alone read as invisible against one or the other. z-index above
       every card (up to 9) but below .screen-flash (10), so a flash still
       washes over it if the two ever overlap. */
    .cam-cue { position: absolute; top: 95%; transform: translateY(-50%);
      z-index: 9; pointer-events: none; opacity: 0; transition: opacity .3s ease;
      font: 800 clamp(28px, 6vw, 56px)/1.1 var(--th);
      color: #B5E3D8;
      text-shadow: 0 3px 10px rgba(0, 0, 0, .55), 0 0 22px rgba(181, 227, 216, .8); }
    /* -33vw worked on a wide desktop test window but pushed the text fully
       off-screen on a narrow/mobile one — there's much less real margin
       outside .cam-scene there. .cam-scene's own width, min(400px, 88vw),
       implies a side margin of (100vw - width)/2 — substituting and
       simplifying (50vw minus a min becomes a max of the two 50vw-a
       terms) gives max(50vw - 200px, 6vw) for that margin. (An earlier
       version of this had the min/max backwards, which as written actually
       clamped EVERY width down to the tiny mobile-style margin, quietly
       undoing the desktop spacing without ever showing up in a mobile-only
       test.) max(-33vw, -1 * that) then picks whichever is LESS negative:
       on a wide screen the true margin is huge, so it's capped at the
       -33vw the "too far" feedback settled on; on a narrow one the margin
       itself is tiny, so it falls back to hugging that instead of
       vanishing off-screen. --cue-gap holds the raw margin so .cam-note
       below can reuse the identical value without repeating the formula. */
    :root { --cue-gap: max(50vw - 200px, 6vw); }
    .cam-cue.left { left: max(-33vw, calc(-1 * var(--cue-gap))); text-align: left; }
    .cam-cue.right { right: max(-33vw, calc(-1 * var(--cue-gap))); text-align: right; }
    /* A single digit next to a 5-character word reads as noticeably
       smaller/weaker even at the identical font-size, just from having so
       much less shape on screen — sized up and given some breathing room
       so 3/2/1 carry the same visual weight "ยิ้มมมม" does, not smaller. */
    .cam-cue.c3, .cam-cue.c2, .cam-cue.c1 {
      font-size: clamp(46px, 11vw, 96px); letter-spacing: .03em; }
    .cam-cue.c3 { color: #ffd34d;
      text-shadow: 0 3px 10px rgba(0, 0, 0, .55), 0 0 22px rgba(255, 211, 77, .8); }
    .cam-cue.c2 { color: #ff9f45;
      text-shadow: 0 3px 10px rgba(0, 0, 0, .55), 0 0 22px rgba(255, 159, 69, .8); }
    .cam-cue.c1 { color: #ff4b4b;
      text-shadow: 0 3px 10px rgba(0, 0, 0, .55), 0 0 22px rgba(255, 75, 75, .8); }
    .cam-cue.show { opacity: 1; }

    /* Back to 105%, sized to .p1/.p2 only — not the taller p3–p6 stack.
       .cam-cta's button is only ever visible/relevant during that early
       p1/p2 phase (it's long hidden by the time the burst even starts),
       and .cam-note now lives beside the stack rather than below it (see
       its own CSS), so nothing in normal flow actually needs clearance
       for the burst's own extent any more. A 135% version of this existed
       briefly for that now-moot reason and just pushed the snap button
       needlessly far below the first photo, unrelated to anything it was
       meant to clear. */
    .cam-scene { position: relative; z-index: 2; width: min(400px, 88vw); margin: 0 auto 105%; }

    .cam { position: relative; z-index: 3; display: block; width: 100%; height: auto;
      transform-origin: 50% 88%; }

    /* .p1 (the first card) plays the moment this beat appears, exactly like
       before there was a second card at all — camWiggle plays right along
       with it, unconditionally, timed the same as .f1's flash. The second
       snap needs the exact same shake again, but re-adding the identical
       animation-name doesn't reliably restart it (the computed value never
       changes, so nothing tells the browser to replay it) — camWiggle2 is a
       byte-for-byte duplicate under a different name purely so toggling
       #camBeatInner.snapped (added by game/scenes.js on that click) genuinely
       switches the camera onto a fresh run of it. */
    @keyframes camWiggle {
      0%   { transform: rotate(0deg); }
      22%  { transform: rotate(-2.2deg); }
      50%  { transform: rotate(2deg); }
      75%  { transform: rotate(-.8deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes camWiggle2 {
      0%   { transform: rotate(0deg); }
      22%  { transform: rotate(-2.2deg); }
      50%  { transform: rotate(2deg); }
      75%  { transform: rotate(-.8deg); }
      100% { transform: rotate(0deg); }
    }
    .cam { animation: camWiggle .45s ease; }
    .cam-beat-inner.snapped .cam { animation: camWiggle2 .45s ease; }

    /* Measured directly against assets/ui/instax-camera.png: the flash panel
       sits in the upper-left. One stacked instance per card, f1–f6 — an
       animation can't just be "replayed" by re-adding the same class, so
       each snap gets its own flash element rather than re-triggering an
       earlier one. f1 fires unconditionally with .p1; f2 with the .p2 tap
       (.snapped); f3–f6 are switched on by their own .clickN class — a
       separate trigger from .p3–p6's own .goN, because the burst is two
       phases now: four quick clicks (flashes only, no cards moving yet),
       then the prints themselves emerging slowly one at a time — see
       startBurst() in game/scenes.js. All six flashes share the same
       camFlash timing/shape, matched to the reference spec: burst peaks at
       150ms (30% of the 500ms total), fades out by ~450ms. Warm white (not
       pure white) per the spec's flash colour, and the radial gradient's
       own soft falloff is the "subtle rays" — box-shadow adds a second,
       wider soft glow around it at the same time so the burst reads as
       light spilling off the bulb, not just a lit disc. */
    .cam-flash { position: absolute; z-index: 4; top: 6%; left: 16%; width: 18%;
      height: 30%; pointer-events: none; border-radius: 50%;
      background: radial-gradient(circle at 45% 40%, #fff8ea 0%, rgba(255,224,150,.88) 42%,
        rgba(255,214,120,0) 74%);
      opacity: 0; box-shadow: 0 0 0 0 rgba(255,214,120,0); }
    .cam-flash.f1 { animation: camFlash .5s ease-out both; }
    .cam-beat-inner.snapped .cam-flash.f2 { animation: camFlash .5s ease-out both; }
    .cam-beat-inner.click3 .cam-flash.f3 { animation: camFlash .5s ease-out both; }
    .cam-beat-inner.click4 .cam-flash.f4 { animation: camFlash .5s ease-out both; }
    .cam-beat-inner.click5 .cam-flash.f5 { animation: camFlash .5s ease-out both; }
    .cam-beat-inner.click6 .cam-flash.f6 { animation: camFlash .5s ease-out both; }
    .cam-beat-inner.click7 .cam-flash.f7 { animation: camFlash .5s ease-out both; }
    .cam-beat-inner.click8 .cam-flash.f8 { animation: camFlash .5s ease-out both; }
    .cam-beat-inner.click9 .cam-flash.f9 { animation: camFlash .5s ease-out both; }
    .cam-beat-inner.click10 .cam-flash.f10 { animation: camFlash .5s ease-out both; }
    @keyframes camFlash {
      0%   { opacity: 0;  box-shadow: 0 0 0 0 rgba(255,214,120,0); }
      18%  { opacity: 1;  box-shadow: 0 0 24px 11px rgba(255,214,120,.55); }
      30%  { opacity: 1;  box-shadow: 0 0 26px 12px rgba(255,214,120,.5); }
      70%  { opacity: .12; box-shadow: 0 0 10px 4px rgba(255,214,120,.14); }
      100% { opacity: 0;  box-shadow: 0 0 0 0 rgba(255,214,120,0); }
    }

    /* The bulb glow alone read as too small/local — this floods the whole
       screen white for an instant, same moment as its matching .cam-flash,
       then eases back down over the rest of camScreenFlash's own longer
       tail, so it reads as "the flash lit up the room" rather than just a
       lamp lighting up. z-index 10 — above every card — because a real
       flash would wash out everything in view for that instant, camera
       and prints included, not just the backdrop. */
    .screen-flash { position: fixed; inset: 0; z-index: 10; pointer-events: none;
      opacity: 0; background: #fff8ea; }
    .screen-flash.sf1 { animation: camScreenFlash .8s ease-out both; }
    .cam-beat-inner.snapped .screen-flash.sf2 { animation: camScreenFlash .8s ease-out both; }
    .cam-beat-inner.click3 .screen-flash.sf3 { animation: camScreenFlash .8s ease-out both; }
    .cam-beat-inner.click4 .screen-flash.sf4 { animation: camScreenFlash .8s ease-out both; }
    .cam-beat-inner.click5 .screen-flash.sf5 { animation: camScreenFlash .8s ease-out both; }
    .cam-beat-inner.click6 .screen-flash.sf6 { animation: camScreenFlash .8s ease-out both; }
    .cam-beat-inner.click7 .screen-flash.sf7 { animation: camScreenFlash .8s ease-out both; }
    .cam-beat-inner.click8 .screen-flash.sf8 { animation: camScreenFlash .8s ease-out both; }
    .cam-beat-inner.click9 .screen-flash.sf9 { animation: camScreenFlash .8s ease-out both; }
    .cam-beat-inner.click10 .screen-flash.sf10 { animation: camScreenFlash .8s ease-out both; }
    @keyframes camScreenFlash {
      0%   { opacity: 0; }
      12%  { opacity: .95; }
      25%  { opacity: .8; }
      55%  { opacity: .3; }
      100% { opacity: 0; }
    }

    /* The slot sits at 84.1% down the image. overflow:hidden here is what
       produces the "printing" look: the card is full size the whole time,
       this box just only ever shows the part of it that has cleared the
       slot line. Width is wider than either card's own 63% — cam-photo is
       centred within it via left/margin-left below — because camDrift/
       camDrift2 rotate the cards once they land, and a rotated rectangle's
       bounding box is wider than the card itself; a mask sized to exactly
       the unrotated card width sliced the corners off in a straight
       diagonal line at the tilt's extremes. */
    /* height was 120% — tight enough to hard-clip a card's own drop shadow
       in a straight line at the bottom, which read as a chipped edge. 480%
       gives the shadow and every card's settle-drop tilt room to clear the
       bottom edge without getting clipped — .p10, the last of the whole
       ten-card sequence (pac/ then couple/), lands the furthest down. */
    .cam-slot-mask { position: absolute; z-index: 4; top: 84.1%; left: 50%;
      width: 88%; margin-left: -44%; height: 480%; overflow: hidden;
      pointer-events: none; }

    /* Straight down and out, no tilt — a print sliding straight out, not
       something dropping loose and askew. camDrift/camDrift2 are second,
       separate animations layered after camEject: because they use
       fill-mode forwards (not both), they contribute nothing until their
       own delay elapses, so neither can clobber camEject's printing
       motion — they just pick up exactly where it leaves off. .p2 comes
       after .p1 in the markup (see game/scenes.js), so it paints on top,
       landing ON the first card rather than under it. */
    /* width ~71.6% of the now-88%-wide mask == the same 63% of .cam-scene
       the card has always been — widened from 75%/84% once camDrift10's
       own 15° max rotation needed slightly more corner clearance than the
       original width gave it; only the mask grew, so left/margin-left
       re-centres the cards inside it. */
    .cam-photo { position: absolute; top: 0; left: 50%; width: 71.6%; margin-left: -35.8%;
      pointer-events: auto;
      transform: translateY(-100%); }
    /* Every card's eject is now 2.9s, up from 1.7s/1.9s — matched to
       camSlide (assets/audio/slide_polaroid.mp3), the sound that plays for the
       print physically sliding out (see the JS triggers in scenes.js,
       each one scheduled for its own card's eject delay so the sound
       starts exactly when the motion does), so the two finish together
       instead of the sound running out while the card's still moving or
       the card stopping while sound is still playing. */
    .cam-photo.p1 {
      animation: camEject 2.9s cubic-bezier(.22,.7,.24,1) .35s both,
                 camDrift 1.9s cubic-bezier(.3,.1,.3,1) 5.25s forwards; }
    /* .p2 only (not .p1): 2.5s eject delay = 1s flash + a clean 1.5s pause
       after it, so the second snap's flash reads as its own moment before
       the print starts sliding out, instead of the two nearly overlapping
       the way .p1's still do. */
    .cam-beat-inner.snapped .cam-photo.p2 {
      animation: camEject 2.9s cubic-bezier(.22,.7,.24,1) 2.5s both,
                 camDrift2 1.9s cubic-bezier(.3,.1,.3,1) 7.4s forwards; }
    /* p3–p6: the party photos. The four clicks (.cam-flash.f3–f6) already
       happened as their own quick burst before any of these fire — these
       are just the slow, one-at-a-time printing that follows, so each
       card's own timeline (.3s eject delay, 2.9s eject, .8s hold, 2.2s
       drift — 6.2s settle total, see startBurst() in game/scenes.js for
       how the four are staggered a full cycle apart) is deliberately
       unhurried rather than matched to the clicks' own quick pace. */
    .cam-beat-inner.go3 .cam-photo.p3 {
      animation: camEject 2.9s cubic-bezier(.22,.7,.24,1) .3s both,
                 camDrift3 2.2s cubic-bezier(.3,.1,.3,1) 4s forwards; }
    .cam-beat-inner.go4 .cam-photo.p4 {
      animation: camEject 2.9s cubic-bezier(.22,.7,.24,1) .3s both,
                 camDrift4 2.2s cubic-bezier(.3,.1,.3,1) 4s forwards; }
    .cam-beat-inner.go5 .cam-photo.p5 {
      animation: camEject 2.9s cubic-bezier(.22,.7,.24,1) .3s both,
                 camDrift5 2.2s cubic-bezier(.3,.1,.3,1) 4s forwards; }
    .cam-beat-inner.go6 .cam-photo.p6 {
      animation: camEject 2.9s cubic-bezier(.22,.7,.24,1) .3s both,
                 camDrift6 2.2s cubic-bezier(.3,.1,.3,1) 4s forwards; }
    /* p7–p10: the couple/ burst, same shape/timing as p3–p6, just
       continuing the fan-out (camDrift7–10 below) further down and
       further round than p3–p6 already went. */
    .cam-beat-inner.go7 .cam-photo.p7 {
      animation: camEject 2.9s cubic-bezier(.22,.7,.24,1) .3s both,
                 camDrift7 2.2s cubic-bezier(.3,.1,.3,1) 4s forwards; }
    .cam-beat-inner.go8 .cam-photo.p8 {
      animation: camEject 2.9s cubic-bezier(.22,.7,.24,1) .3s both,
                 camDrift8 2.2s cubic-bezier(.3,.1,.3,1) 4s forwards; }
    .cam-beat-inner.go9 .cam-photo.p9 {
      animation: camEject 2.9s cubic-bezier(.22,.7,.24,1) .3s both,
                 camDrift9 2.2s cubic-bezier(.3,.1,.3,1) 4s forwards; }
    .cam-beat-inner.go10 .cam-photo.p10 {
      animation: camEject 2.9s cubic-bezier(.22,.7,.24,1) .3s both,
                 camDrift10 2.2s cubic-bezier(.3,.1,.3,1) 4s forwards; }
    @keyframes camEject {
      /* opacity, not just transform: every card sits tucked up at
         translateY(-100%) from the moment this beat mounts, long before
         its own delay elapses (animation-fill-mode: both applies the 0%
         state during that whole wait) — cam-slot-mask's overflow:hidden
         clips the card ITSELF there, but not its own box-shadow, which
         lands just below the card's tucked-away bottom edge, i.e. right
         at the slot opening, and rendered as a stray dark smudge under
         the camera before anything had even printed. Snapping opacity to
         1 in the first 1% (not a slow fade matched to the full 2.9s, which
         would look like the print fading in while it slides) hides that
         shadow until the card is actually, visibly ejecting. */
      0%   { opacity: 0; transform: translateY(-100%); }
      1%   { opacity: 1; }
      100% { transform: translateY(0%); }
    }

    /* .p1: starts 5.25s in (.35s eject delay + 2.9s eject + a clean 2s of
       the card just sitting printed in the slot before it lets go). This is
       NOT a long fall down the page — a real ejected print's own weight
       just peels it off the rollers and it flops a short way down,
       landing almost directly under the slot, the way the reference clip
       shows it. Small rotation, almost no sideways drift, a slight
       overshoot at 70% and a settle back by 100% for the landing bounce. */
    @keyframes camDrift {
      0%   { transform: translateY(0%)   translateX(0%)   rotate(0deg);   }
      30%  { transform: translateY(7%)   translateX(-.5%) rotate(-1.5deg);}
      55%  { transform: translateY(16%)  translateX(.5%)  rotate(-3deg);  }
      70%  { transform: translateY(24%)  translateX(0%)   rotate(-5.5deg);}
      88%  { transform: translateY(19%)  translateX(0%)   rotate(-4deg);  }
      100% { transform: translateY(20%)  translateX(0%)   rotate(-4.2deg);}
    }
    /* Same shape as camDrift, but lands lower and tipped the other way, so
       the second card reads as a new print stacking onto the first one
       rather than a duplicate landing in the exact same spot. */
    @keyframes camDrift2 {
      0%   { transform: translateY(0%)   translateX(0%)   rotate(0deg);  }
      30%  { transform: translateY(9%)   translateX(.5%)  rotate(2deg);  }
      55%  { transform: translateY(21%)  translateX(-.5%) rotate(4deg);  }
      70%  { transform: translateY(31%)  translateX(0%)   rotate(7deg);  }
      88%  { transform: translateY(25%)  translateX(0%)   rotate(5.2deg);}
      100% { transform: translateY(26%)  translateX(0%)   rotate(5.5deg);}
    }
    /* camDrift3–6: each burst card lands a bit further down than the last
       and tips the opposite way from its neighbour, so the four fan out
       into a loose, overlapping pile instead of stacking dead-on-center. */
    @keyframes camDrift3 {
      0%   { transform: translateY(0%)   translateX(0%)   rotate(0deg);   }
      30%  { transform: translateY(11%)  translateX(-.5%) rotate(-2.5deg);}
      55%  { transform: translateY(26%)  translateX(.5%)  rotate(-5deg);  }
      70%  { transform: translateY(37%)  translateX(0%)   rotate(-8deg);  }
      88%  { transform: translateY(31%)  translateX(0%)   rotate(-6.2deg);}
      100% { transform: translateY(32%)  translateX(0%)   rotate(-6.6deg);}
    }
    @keyframes camDrift4 {
      0%   { transform: translateY(0%)   translateX(0%)   rotate(0deg);  }
      30%  { transform: translateY(13%)  translateX(.6%)  rotate(3deg);  }
      55%  { transform: translateY(31%)  translateX(-.6%) rotate(6deg);  }
      70%  { transform: translateY(43%)  translateX(0%)   rotate(9deg);  }
      88%  { transform: translateY(37%)  translateX(0%)   rotate(7.2deg);}
      100% { transform: translateY(38%)  translateX(0%)   rotate(7.6deg);}
    }
    @keyframes camDrift5 {
      0%   { transform: translateY(0%)   translateX(0%)   rotate(0deg);   }
      30%  { transform: translateY(15%)  translateX(-.6%) rotate(-3.5deg);}
      55%  { transform: translateY(36%)  translateX(.6%)  rotate(-7deg);  }
      70%  { transform: translateY(49%)  translateX(0%)   rotate(-10deg); }
      88%  { transform: translateY(43%)  translateX(0%)   rotate(-8.2deg);}
      100% { transform: translateY(44%)  translateX(0%)   rotate(-8.6deg);}
    }
    @keyframes camDrift6 {
      0%   { transform: translateY(0%)   translateX(0%)   rotate(0deg);  }
      30%  { transform: translateY(17%)  translateX(.7%)  rotate(4deg);  }
      55%  { transform: translateY(41%)  translateX(-.7%) rotate(8deg);  }
      70%  { transform: translateY(55%)  translateX(0%)   rotate(11deg); }
      88%  { transform: translateY(49%)  translateX(0%)   rotate(9.2deg);}
      100% { transform: translateY(50%)  translateX(0%)   rotate(9.6deg);}
    }
    /* camDrift7–10: the couple/ burst continues the same fan-out further
       down and further round — each card still lands lower and tips the
       other way from the one before it, same as camDrift3–6 did. */
    @keyframes camDrift7 {
      0%   { transform: translateY(0%)   translateX(0%)   rotate(0deg);   }
      30%  { transform: translateY(19%)  translateX(-.8%) rotate(-4.5deg);}
      55%  { transform: translateY(46%)  translateX(.8%)  rotate(-9deg);  }
      70%  { transform: translateY(61%)  translateX(0%)   rotate(-12deg); }
      88%  { transform: translateY(55%)  translateX(0%)   rotate(-10.2deg);}
      100% { transform: translateY(56%)  translateX(0%)   rotate(-10.6deg);}
    }
    @keyframes camDrift8 {
      0%   { transform: translateY(0%)   translateX(0%)   rotate(0deg);  }
      30%  { transform: translateY(21%)  translateX(.8%)  rotate(5deg);  }
      55%  { transform: translateY(51%)  translateX(-.8%) rotate(10deg); }
      70%  { transform: translateY(67%)  translateX(0%)   rotate(13deg); }
      88%  { transform: translateY(61%)  translateX(0%)   rotate(11.2deg);}
      100% { transform: translateY(62%)  translateX(0%)   rotate(11.6deg);}
    }
    @keyframes camDrift9 {
      0%   { transform: translateY(0%)   translateX(0%)   rotate(0deg);    }
      30%  { transform: translateY(23%)  translateX(-.9%) rotate(-5.5deg); }
      55%  { transform: translateY(56%)  translateX(.9%)  rotate(-11deg);  }
      70%  { transform: translateY(73%)  translateX(0%)   rotate(-14deg);  }
      88%  { transform: translateY(67%)  translateX(0%)   rotate(-12.2deg);}
      100% { transform: translateY(68%)  translateX(0%)   rotate(-12.6deg);}
    }
    @keyframes camDrift10 {
      0%   { transform: translateY(0%)   translateX(0%)   rotate(0deg);  }
      30%  { transform: translateY(25%)  translateX(.9%)  rotate(6deg);  }
      55%  { transform: translateY(61%)  translateX(-.9%) rotate(12deg); }
      70%  { transform: translateY(79%)  translateX(0%)   rotate(15deg); }
      88%  { transform: translateY(73%)  translateX(0%)   rotate(13.2deg);}
      100% { transform: translateY(74%)  translateX(0%)   rotate(13.6deg);}
    }
    .cam-photo .polaroid { width: 100%; margin: 0; background: #fff; padding: 10px 10px 30px;
      box-sizing: border-box; border-radius: 3px;
      box-shadow: 0 20px 42px rgba(0,0,0,.32), 0 2px 0 rgba(0,0,0,.05); }
    .cam-photo .polaroid-shot { position: relative; aspect-ratio: 3 / 4; overflow: hidden; }
    .cam-photo .polaroid-shot img { display: block; width: 100%; height: 100%; object-fit: cover; }
    /* The card comes out blank first, same as a real instant print — the
       shot only fades in once it's mostly out of the camera, not visible
       (even blurred) from the moment it starts moving. */
    .polaroid-blank { position: absolute; inset: 0; background: #d9d4cd; opacity: 1; }
    /* .p1: 2.35s = .35s eject delay + (2.9s eject − .9s fade), so the
       fade finishes exactly as the eject motion does. */
    .cam-photo.p1 .polaroid-blank { animation: camBlankFade .9s ease-out 2.35s both; }
    /* .p2: 4.5s = 2.5s eject delay + (2.9s eject − .9s fade). */
    .cam-beat-inner.snapped .cam-photo.p2 .polaroid-blank { animation: camBlankFade .9s ease-out 4.5s both; }
    /* p3–p6: 2.2s = .3s eject delay + (2.9s eject − 1s fade), same
       "mostly out before it shows" ratio the rest of the cards use. */
    .cam-beat-inner.go3 .cam-photo.p3 .polaroid-blank { animation: camBlankFade 1s ease-out 2.2s both; }
    .cam-beat-inner.go4 .cam-photo.p4 .polaroid-blank { animation: camBlankFade 1s ease-out 2.2s both; }
    .cam-beat-inner.go5 .cam-photo.p5 .polaroid-blank { animation: camBlankFade 1s ease-out 2.2s both; }
    .cam-beat-inner.go6 .cam-photo.p6 .polaroid-blank { animation: camBlankFade 1s ease-out 2.2s both; }
    .cam-beat-inner.go7 .cam-photo.p7 .polaroid-blank { animation: camBlankFade 1s ease-out 2.2s both; }
    .cam-beat-inner.go8 .cam-photo.p8 .polaroid-blank { animation: camBlankFade 1s ease-out 2.2s both; }
    .cam-beat-inner.go9 .cam-photo.p9 .polaroid-blank { animation: camBlankFade 1s ease-out 2.2s both; }
    .cam-beat-inner.go10 .cam-photo.p10 .polaroid-blank { animation: camBlankFade 1s ease-out 2.2s both; }
    @keyframes camBlankFade {
      0%   { opacity: 1; }
      100% { opacity: 0; }
    }

    /* There's no "→" button any more — once .p6 lands, game/scenes.js's
       startBurst() moves on by itself after a moment. */

    .cam-cta { position: relative; z-index: 2; display: flex; justify-content: center; }

    /* Appears once .p1 has settled (7.45s: .35s eject delay + 2.9s eject +
       2s hold + 1.9s drift + a small pause), invites the second snap, then
       fades itself out the instant it's tapped. camSnapPulse is a second,
       looping animation layered on top (comma-separated in the shorthand) —
       it only touches box-shadow/transform, camSnapBtnIn only touches
       opacity, so they run independently without one clobbering the other.
       It starts right as the fade-in finishes (7.95s) and keeps a slow
       glow-and-swell going the whole time the button is just sitting there
       waiting, so it reads as "press me" rather than a plain static label. */
    /* .tap's own default (a transparent fill, just a thin border) reads as
       basically invisible sitting on the pink background — fine for a
       secondary action, not for the one button the whole scene hinges on.
       A solid fill here means it's unmistakably a button without needing
       a hover to reveal it. */
    .cam-snap-btn { opacity: 0; white-space: nowrap;
      background: #fff8ea; border-color: rgba(0,0,0,.12); color: #2a2530;
      box-shadow: 0 6px 18px -6px rgba(0,0,0,.35);
      animation: camSnapBtnIn .5s ease 7.45s both,
                 camSnapPulse 1.8s ease-in-out 7.95s infinite; }
    .cam-snap-btn:hover { background: #fff2d9; }
    /* .counting (added the instant it's tapped, before the smile/countdown
       even starts) rather than .snapped (added only once the countdown
       finishes) — the button has to be gone for the whole countdown, not
       just re-appear and sit there through it. */
    .cam-beat-inner.counting .cam-snap-btn { animation: camSnapBtnOut .35s ease both; }
    @keyframes camSnapBtnIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes camSnapBtnOut { from { opacity: 1; } to { opacity: 0; } }
    @keyframes camSnapPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 214, 150, .45); transform: scale(1); }
      50%      { box-shadow: 0 0 0 9px rgba(255, 214, 150, 0); transform: scale(1.04); }
    }

    @media (prefers-reduced-motion: reduce) {
      .cam-cue { transition: none; }
      /* A full-screen white flash is exactly the kind of thing reduced-
         motion (and photosensitivity) exists to suppress — !important
         because every trigger rule above is a higher-specificity class
         combo (.cam-beat-inner.snapped .screen-flash.sf2 etc.) that would
         otherwise win over a plain .screen-flash override here. */
      .screen-flash { animation: none !important; opacity: 0 !important; }
      .cam-dim { animation: none; opacity: 1; }
      .cam-snow { animation: none; opacity: 0; }
      .snowflake { animation: none; }
      .cam-note .note-line { transition: none; transform: none; }
      .cam, .cam-flash.f1, .cam-photo.p1, .cam-photo.p1 .polaroid-blank,
      .cam-snap-btn { animation: none; }
      .cam-photo.p1 { transform: translateY(20%) rotate(-4.2deg); }
      .cam-photo.p1 .polaroid-blank { opacity: 0; }
      .cam-snap-btn { opacity: 1; }
      .cam-beat-inner.snapped .cam,
      .cam-beat-inner.snapped .cam-flash.f2,
      .cam-beat-inner.snapped .cam-photo.p2,
      .cam-beat-inner.snapped .cam-photo.p2 .polaroid-blank,
      .cam-beat-inner.snapped .cam-snap-btn { animation: none; }
      .cam-beat-inner.snapped .cam-photo.p2 { transform: translateY(26%) rotate(5.5deg); }
      .cam-beat-inner.snapped .cam-photo.p2 .polaroid-blank { opacity: 0; }
      .cam-beat-inner.snapped .cam-snap-btn { opacity: 0; }
      /* p3–p6: same "skip straight to the landed state" treatment. Flash
         is gated by .clickN, the card itself by .goN — the two phases from
         startBurst() in game/scenes.js. */
      .cam-beat-inner.click3 .cam-flash.f3,
      .cam-beat-inner.go3 .cam-photo.p3,
      .cam-beat-inner.go3 .cam-photo.p3 .polaroid-blank { animation: none; }
      .cam-beat-inner.go3 .cam-photo.p3 { transform: translateY(32%) rotate(-6.6deg); }
      .cam-beat-inner.go3 .cam-photo.p3 .polaroid-blank { opacity: 0; }
      .cam-beat-inner.click4 .cam-flash.f4,
      .cam-beat-inner.go4 .cam-photo.p4,
      .cam-beat-inner.go4 .cam-photo.p4 .polaroid-blank { animation: none; }
      .cam-beat-inner.go4 .cam-photo.p4 { transform: translateY(38%) rotate(7.6deg); }
      .cam-beat-inner.go4 .cam-photo.p4 .polaroid-blank { opacity: 0; }
      .cam-beat-inner.click5 .cam-flash.f5,
      .cam-beat-inner.go5 .cam-photo.p5,
      .cam-beat-inner.go5 .cam-photo.p5 .polaroid-blank { animation: none; }
      .cam-beat-inner.go5 .cam-photo.p5 { transform: translateY(44%) rotate(-8.6deg); }
      .cam-beat-inner.go5 .cam-photo.p5 .polaroid-blank { opacity: 0; }
      .cam-beat-inner.click6 .cam-flash.f6,
      .cam-beat-inner.go6 .cam-photo.p6,
      .cam-beat-inner.go6 .cam-photo.p6 .polaroid-blank { animation: none; }
      .cam-beat-inner.go6 .cam-photo.p6 { transform: translateY(50%) rotate(9.6deg); }
      .cam-beat-inner.go6 .cam-photo.p6 .polaroid-blank { opacity: 0; }
      .cam-beat-inner.click7 .cam-flash.f7,
      .cam-beat-inner.go7 .cam-photo.p7,
      .cam-beat-inner.go7 .cam-photo.p7 .polaroid-blank { animation: none; }
      .cam-beat-inner.go7 .cam-photo.p7 { transform: translateY(56%) rotate(-10.6deg); }
      .cam-beat-inner.go7 .cam-photo.p7 .polaroid-blank { opacity: 0; }
      .cam-beat-inner.click8 .cam-flash.f8,
      .cam-beat-inner.go8 .cam-photo.p8,
      .cam-beat-inner.go8 .cam-photo.p8 .polaroid-blank { animation: none; }
      .cam-beat-inner.go8 .cam-photo.p8 { transform: translateY(62%) rotate(11.6deg); }
      .cam-beat-inner.go8 .cam-photo.p8 .polaroid-blank { opacity: 0; }
      .cam-beat-inner.click9 .cam-flash.f9,
      .cam-beat-inner.go9 .cam-photo.p9,
      .cam-beat-inner.go9 .cam-photo.p9 .polaroid-blank { animation: none; }
      .cam-beat-inner.go9 .cam-photo.p9 { transform: translateY(68%) rotate(-12.6deg); }
      .cam-beat-inner.go9 .cam-photo.p9 .polaroid-blank { opacity: 0; }
      .cam-beat-inner.click10 .cam-flash.f10,
      .cam-beat-inner.go10 .cam-photo.p10,
      .cam-beat-inner.go10 .cam-photo.p10 .polaroid-blank { animation: none; }
      .cam-beat-inner.go10 .cam-photo.p10 { transform: translateY(74%) rotate(13.6deg); }
      .cam-beat-inner.go10 .cam-photo.p10 .polaroid-blank { opacity: 0; }
    }

    /* -------------------------------------------------------------- envelope */

    /* The beat after the burst: a small envelope that settles in, wobbles
       like it's asking to be opened, then "speaks" its one line one
       character at a time. Tapping it moves straight into a real camera
       request — no fake photo option, since the whole point is that this
       one is actually her, taken live, not a stand-in. */
    .env-beat-inner { display: flex; flex-direction: column; align-items: center;
      text-align: center; width: 100%; }

    .env-icon { display: block; width: min(220px, 58vw); border-radius: 14px; opacity: 0;
      filter: drop-shadow(0 10px 24px rgba(0,0,0,.45));
      animation: envIconIn 1.5s ease-out .1s both, envWobble 2.6s ease-in-out 1.6s infinite; }
    @keyframes envIconIn {
      from { opacity: 0; transform: translateY(14px) scale(.9); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes envWobble {
      0%, 100% { transform: rotate(0deg); }
      20%      { transform: rotate(-7deg); }
      40%      { transform: rotate(6deg); }
      60%      { transform: rotate(-4deg); }
      80%      { transform: rotate(3deg); }
    }

    .env-bubble { position: relative; margin-top: 26px; max-width: min(320px, 82vw);
      padding: 14px 20px; border-radius: 20px; background: #fff8ea; color: #2a2530;
      font: 600 clamp(17px, 4.4vw, 22px)/1.5 var(--th-serif);
      box-shadow: 0 14px 34px rgba(0,0,0,.35);
      opacity: 0; transform: translateY(10px);
      animation: envBubbleIn .8s ease-out 1.5s both; }
    .env-bubble::after { content: ""; position: absolute; top: -8px; left: 50%;
      margin-left: -8px; width: 16px; height: 16px; background: #fff8ea;
      transform: rotate(45deg); border-radius: 3px; }
    @keyframes envBubbleIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .env-caret { display: inline-block; margin-left: 2px; opacity: 0;
      animation: envCaretBlink 1s steps(1) infinite; }
    @keyframes envCaretBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

    /* .ready = the line finished typing; the whole thing becomes tappable
       and pulses gently so it reads as an actual button, not just text. */
    .env-beat-inner.ready { cursor: pointer; }
    .env-beat-inner.ready .env-icon { animation: envIconIn 1.5s ease-out .1s both,
      envWobble 2.6s ease-in-out 1.6s infinite, envPulse 1.6s ease-in-out .1s infinite; }
    @keyframes envPulse {
      0%, 100% { filter: drop-shadow(0 10px 24px rgba(0,0,0,.45)); }
      50%      { filter: drop-shadow(0 10px 30px rgba(255,214,150,.65)); }
    }
    /* Opening: icon + bubble step out of the way once tapped, before the
       camera view takes over the same spot. */
    .env-beat-inner.opening .env-icon,
    .env-beat-inner.opening .env-bubble { animation: envFadeOut .4s ease both; }
    @keyframes envFadeOut { from { opacity: 1; } to { opacity: 0; } }

    .env-cam, .env-error, .env-result { display: none; }
    .env-beat-inner.camready .env-cam { display: flex; }
    .env-beat-inner.camerror .env-error { display: flex; }
    .env-beat-inner.captured .env-result { display: flex; }

    .env-cam { flex-direction: column; align-items: center; margin-top: 8px;
      animation: envFadeIn .5s ease .1s both; }
    @keyframes envFadeIn { from { opacity: 0; } to { opacity: 1; } }
    .env-cam video { width: min(320px, 82vw); aspect-ratio: 3 / 4; object-fit: cover;
      border-radius: 14px; background: #111; transform: scaleX(-1);
      box-shadow: 0 14px 40px rgba(0,0,0,.5); }
    .env-shutter { appearance: none; border: none; margin-top: 20px; width: 64px; height: 64px;
      border-radius: 999px; background: #fff8ea; box-shadow: 0 0 0 4px rgba(255,255,255,.28);
      cursor: pointer; animation: camSnapPulse 1.8s ease-in-out infinite; }
    .env-hint { margin: 14px 0 0; font: 600 13px/1.4 var(--th); letter-spacing: .04em;
      color: rgba(255,255,255,.75); }

    .env-error { flex-direction: column; align-items: center; margin-top: 8px;
      max-width: min(320px, 82vw); }
    .env-error p { margin: 0 0 16px; font: 500 15px/1.6 var(--th); color: rgba(255,255,255,.85); }
    .env-error .tap { margin: 0 0 10px; }
    .env-skip { background: transparent; border-color: rgba(255,255,255,.35); }

    .env-result { flex-direction: column; align-items: center; }
    .env-polaroid { width: min(300px, 80vw); margin: 0; background: #fff; padding: 10px 10px 26px;
      box-shadow: 0 20px 46px rgba(0,0,0,.5);
      animation: envPhotoIn 1.1s cubic-bezier(.22,.7,.24,1) .05s both; }
    .env-polaroid .polaroid-shot { position: relative; aspect-ratio: 3 / 4; overflow: hidden; }
    .env-polaroid .polaroid-shot img { display: block; width: 100%; height: 100%; object-fit: cover;
      transform: scaleX(-1); }
    @keyframes envPhotoIn {
      from { opacity: 0; transform: translateY(-24px) rotate(-3deg) scale(.94); }
      60%  { opacity: 1; transform: translateY(6px) rotate(2deg) scale(1.01); }
      100% { opacity: 1; transform: translateY(0) rotate(-1.5deg) scale(1); }
    }

    /* The goodbye line above the printed photo — plain text on the dark
       backdrop (no bubble box needed) reveals itself, so it doesn't need
       its own fade-in animation the way .env-bubble does. */
    .env-caption { margin: 0 0 22px; max-width: min(340px, 84vw); text-align: center;
      font: 700 clamp(22px, 6vw, 30px)/1.5 var(--th-serif); color: #ffd34d;
      text-shadow: 0 2px 10px rgba(0,0,0,.6); }

    /* One last full-screen flash before the cut to the chapters hub — a
       fresh element gated by .flash rather than reusing .screen-flash's
       own keyframe/class, since this one only ever fires once and needs
       to end held at full brightness (not fade back out) so the cut lands
       on white, not back on the dark scene. */
    .env-final-flash { position: fixed; inset: 0; z-index: 20; background: #fff8ea;
      opacity: 0; pointer-events: none; }
    .env-beat-inner.flash .env-final-flash { animation: envFinalFlash .7s ease-out both; }
    @keyframes envFinalFlash { from { opacity: 0; } to { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .env-icon { animation: none; opacity: 1; }
      .env-beat-inner.ready .env-icon { animation: none; }
      .env-bubble { animation: none; opacity: 1; transform: none; }
      .env-caret { animation: none; opacity: 1; }
      .env-beat-inner.opening .env-icon,
      .env-beat-inner.opening .env-bubble { animation: none; opacity: 0; }
      .env-cam { animation: none; }
      .env-shutter { animation: none; }
      .env-polaroid { animation: none; opacity: 1; transform: none; }
      .env-beat-inner.flash .env-final-flash { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <a class="chapter-back" href="../../"
     onclick="sessionStorage.setItem('mybabe:returnFrom','02-bring-m-home')">&#8592; chapters</a>
  <button id="muteBtn" class="chapter-back" style="left:auto;right:12px;cursor:pointer"
          aria-label="mute">&#128266;</button>
  <button id="memoryBagBtn" class="memory-bag-btn" type="button" hidden>🎒 0 / 3</button>

  <div id="wrap"><canvas id="game"></canvas></div>

  <div id="say" aria-live="polite"></div>

  <!-- The ending's freeze-frame: the exact gameplay moment scaling down into
       a polaroid before the cut, using a real capture of the canvas rather
       than a stand-in image. -->
  <div class="cam-snap" id="camSnap" hidden>
    <img class="cam-snap-raw" id="camSnapRaw" alt="" />
  </div>

  <div id="overlay" class="overlay" hidden>
    <div id="overlayInner" class="overlay-inner"></div>
  </div>

  <!-- The opening: an intro image followed by the authored frames, with no HUD
       and no canvas. Two stacked
       layers, because a cross-fade needs the outgoing frame still on screen
       while the incoming one comes up, and one layer can only cut. -->
  <div id="cine" class="cine" hidden>
    <img class="cine-layer" id="cineA" alt="" />
    <img class="cine-layer" id="cineB" alt="" />
    <div class="cine-wipe" id="cineWipe" aria-hidden="true"></div>
    <div class="cine-veil" id="cineVeil" aria-hidden="true"></div>
    <div class="cine-flash" id="cineFlash" aria-hidden="true"></div>
    <p class="cine-skip">tap to skip</p>
  </div>

  <div id="letter" class="letter" hidden><div class="letter-inner" id="letterInner"></div></div>

  <script src="game/rules.js?v=20260826-heal-lines"></script>
  <script src="game/zones.js?v=20260813-zonetitles28"></script>
  <script src="game/input.js?v=20260813-no-mouse"></script>
  <script src="game/audio.js?v=20260827-beat-audible"></script>
  <script src="game/render.js?v=20260826-asset-reorg"></script>
  <script src="game/scenes.js?v=20260827-music-nav-fix"></script>
  <script src="game/main.js?v=20260826-shadow-fix"></script>
</body>
